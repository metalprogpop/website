name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm --filter client exec tsc --noEmit
          pnpm --filter server exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Client tests
        run: pnpm --filter client test

      - name: Server tests
        run: pnpm --filter server test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The e2e suite runs against the docker compose stack, with the
      # dev-only auth flags from .env.example (test users, inline links).
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Migrate the database
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/app
        run: |
          timeout 60 sh -c 'until docker compose exec -T db pg_isready -U dev -d app; do sleep 1; done'
          pnpm db:migrate

      - name: Wait for server and client
        run: |
          timeout 120 sh -c 'until curl -sf http://localhost:13001/api/v1/health; do sleep 2; done'
          timeout 120 sh -c 'until curl -sf http://localhost:9001 > /dev/null; do sleep 2; done'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
