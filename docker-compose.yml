services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    volumes:
      - ./server/src:/app/server/src
      - ./shared/src:/app/shared/src
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "13001:3001"
    environment:
      - DATABASE_URL=postgresql://dev:dev@db:5432/app
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_EXPIRATION_DAYS=90
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAGIC_LINK_BASE_URL=http://localhost:13001
      - MAGIC_LINK_TOKEN_EXPIRATION_MINUTES=10
      - CLIENT_URL=http://localhost:9001
      - TEST_USERS_ENABLED=${TEST_USERS_ENABLED:-false}
      - TEST_USER_EMAILS=${TEST_USER_EMAILS:-}
      - DEV_SHOW_MAGIC_LINK=${DEV_SHOW_MAGIC_LINK:-false}
    depends_on:
      - db
    command: pnpm dev

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    volumes:
      - ./client/src:/app/client/src
      - ./shared/src:/app/shared/src
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "9001:5173"
    environment:
      - VITE_API_URL=http://localhost:13001
      - VITE_TEST_USERS_ENABLED=${VITE_TEST_USERS_ENABLED:-false}
      - VITE_DEV_SHOW_MAGIC_LINK=${VITE_DEV_SHOW_MAGIC_LINK:-false}
    command: pnpm dev

volumes:
  pgdata:
  pnpm-store:
