# Ports are published on loopback only: the dev stack has real data (and,
# with the .env.example flags, test users) and is not meant for the local
# network. The client is the one exception, opt-in: DEV_HOST=0.0.0.0 publishes
# it on the LAN, and with it the API, which the client proxies under /api.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    volumes:
      - ./server/src:/app/server/src
      # Migrations live outside src: mounted so `pnpm db:generate` in the
      # container writes them to the host and `pnpm db:migrate` applies the
      # current set rather than the image's copy.
      - ./server/drizzle:/app/server/drizzle
      - ./shared/src:/app/shared/src
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "127.0.0.1:13001:3001"
    environment:
      - DATABASE_URL=postgresql://dev:dev@db:5432/app
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_EXPIRATION_DAYS=90
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAGIC_LINK_BASE_URL=http://localhost:13001
      - MAGIC_LINK_TOKEN_EXPIRATION_MINUTES=10
      - CLIENT_URL=http://localhost:9001
      - TEST_USERS_ENABLED=${TEST_USERS_ENABLED:-false}
      - TEST_USER_EMAILS=${TEST_USER_EMAILS:-}
      - DEV_SHOW_MAGIC_LINK=${DEV_SHOW_MAGIC_LINK:-false}
    depends_on:
      - db
    command: pnpm dev

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    volumes:
      - ./client/src:/app/client/src
      - ./shared/src:/app/shared/src
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "${DEV_HOST:-127.0.0.1}:9001:5173"
    environment:
      - API_PROXY_TARGET=http://server:3001
      - VITE_TEST_USERS_ENABLED=${VITE_TEST_USERS_ENABLED:-false}
      - VITE_DEV_SHOW_MAGIC_LINK=${VITE_DEV_SHOW_MAGIC_LINK:-false}
    command: pnpm dev

volumes:
  pgdata:
  pnpm-store:
